<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title description">
  <title id="title">DiffKit colored terminal output</title>
  <desc id="description">A semantic Rust call-tree diff with removed lines in red and added lines in green.</desc>
  <rect width="960" height="410" rx="14" fill="#0d1117"/>
  <rect width="960" height="42" rx="14" fill="#161b22"/>
  <rect y="28" width="960" height="14" fill="#161b22"/>
  <circle cx="22" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="21" r="6" fill="#27c93f"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="16" xml:space="preserve">
    <text x="24" y="75" fill="#8b949e">$ diffkit git HEAD^ HEAD</text>
    <text x="24" y="111" fill="#c9d1d9">rustdiff HEAD^ → HEAD</text>
    <text x="24" y="147" fill="#c9d1d9">  checkout(total)</text>
    <text x="24" y="175" fill="#c9d1d9">  ├─ validate(total)</text>
    <text x="24" y="203" fill="#f85149">- ├─ LegacyGateway::charge(total)</text>
    <text x="24" y="231" fill="#3fb950">+ ├─ run&lt;Postgres&gt;(&amp;Postgres, total)</text>
    <text x="24" y="259" fill="#3fb950">+ │  └─ Postgres::save(total)</text>
    <text x="24" y="287" fill="#3fb950">+ │     └─ sql::commit()</text>
    <text x="24" y="315" fill="#c9d1d9">  ├─ dyn Notifier::send(receipt) [partial]</text>
    <text x="24" y="343" fill="#3fb950">+ │  ╠═ Email::send(receipt)</text>
    <text x="24" y="371" fill="#c9d1d9">  │  ╚═ … unresolved targets</text>
    <text x="24" y="399" fill="#c9d1d9">  └─ finalize()</text>
  </g>
</svg>
