[package]
name = "diffkit"
version = "0.1.0"
edition = "2024"
description = "AST-aware structural diffs for polyglot codebases"
license = "MIT"
default-run = "diffkit"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0"
syn = { version = "2.0", features = ["full", "parsing", "visit"] }
tree-sitter = "0.24"
tree-sitter-ocaml = "0.24"
