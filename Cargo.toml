[package]
name = "diffkit-cli"
version = "0.1.1"
edition = "2024"
description = "Semantic call-tree diffs for polyglot codebases"
license = "MIT"
repository = "https://github.com/Pribess/DiffKit"
readme = "README.md"
keywords = ["diff", "call-graph", "semantic-analysis", "rust", "ocaml"]
categories = ["development-tools", "command-line-utilities"]
include = [
    "/.cargo/config.toml",
    "/Cargo.lock",
    "/README.md",
    "/build.rs",
    "/examples/**",
    "/rust-toolchain.toml",
    "/src/**",
    "/support/**",
    "/tests/cli.rs",
    "/tests/ocamldiff.rs",
    "/tests/rustdiff.rs",
    "/tests/fixtures/closure.rs",
]
default-run = "diffkit"

[lib]
name = "diffkit"
path = "src/lib.rs"

[[bin]]
name = "diffkit"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
syn = { version = "2.0", features = ["full", "parsing", "visit", "visit-mut"] }
tree-sitter = "0.24"
tree-sitter-ocaml = "0.24"
