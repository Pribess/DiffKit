[package]
name = "diffkit"
version = "0.1.0"
edition = "2024"
description = "Semantic call-tree diffs for polyglot codebases"
license = "MIT"
default-run = "diffkit"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
quote = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
syn = { version = "2.0", features = ["full", "parsing", "visit", "visit-mut"] }
tree-sitter = "0.24"
tree-sitter-ocaml = "0.24"
